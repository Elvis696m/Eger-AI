<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eger AI Admin</title>

</head>

<body>

    <h1>Eger AI Admin</h1>

    <h2>Add Knowledge</h2>


    <label>Question</label>
    <br>

    <input
        type="text"
        id="question"
        placeholder="Enter the main question"
    >


    <br><br>


    <label>Keywords / Alternative phrases</label>
    <br>

    <input
        type="text"
        id="keywords"
        placeholder="egerton, eger uni, egerton uni"
    >


    <br><br>


    <label>Answer</label>
    <br>

    <textarea
        id="answer"
        placeholder="Enter the answer"
        rows="8"
        cols="50"
    ></textarea>


    <br><br>


    <button id="addButton">
        ADD KNOWLEDGE
    </button>


    <p id="message"></p>


    <script src="admin.js"></script>

</body>

</html>
